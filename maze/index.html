<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kutty Maze</title>
<meta name="theme-color" content="#fff6ea">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../shared/kit.css">
<style>
#area{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-bottom:8px}
.start{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.start h2{margin:0;font-size:30px;font-weight:800}
.start p{margin:0;color:var(--muted);font-weight:700;font-size:16px;max-width:32ch}
.start .art{display:flex;gap:6px;align-items:flex-end}
#mz{border-radius:22px;background:#fff;box-shadow:0 8px 20px rgba(43,37,64,.12),0 0 0 4px #fff;touch-action:none}
</style>
</head>
<body>
<div class="screen">
  <header class="gh">
    <a class="stk" href="../" style="--c:var(--lilac)" aria-label="All games" id="bHome"></a>
    <div class="card"><div class="txt"><span class="lbl" id="lbl">Maze · வழி கண்டுபிடி</span><p class="say" id="say"></p></div><button class="hear" id="bHear" aria-label="Say it again"></button></div>
    <button class="stk" id="bSound" style="--c:var(--sun)"></button>
  </header>
  <div class="rounds" id="rounds"></div>
  <div id="area"></div>
</div>
<div id="overlay"></div>
<script src="../shared/kit.js"></script>
<script>
(function(){
"use strict";
const K=Kit,$=K.$,area=$("#area"),{circ,ell,rrect,fs,seg,poly}=K,PI=Math.PI,TAU=PI*2;
$("#bHome").innerHTML=K.HOME;$("#bHear").innerHTML=K.HEAR;K.soundButton($("#bSound"));
let sayText="",run=0,round=0,mistakes=0,TOTAL=5;
function say(t,parts){sayText=parts||t;$("#say").textContent=t;K.speak(sayText)}
$("#bHear").onclick=()=>K.speak(sayText);
function dots(){$("#rounds").innerHTML=Array.from({length:TOTAL},(_,i)=>`<i class="${i<round?"on":i===round?"cur":""}"></i>`).join("")}
function finishScreen(title,line,small,artName){K.confetti(70);K.speak(title.toLowerCase()+"! "+line);
  $("#overlay").innerHTML=`<div class="done" style="--doneBg:#5b4bb7"><h1>${title}</h1><div class="big" id="bigArt"></div><p>${line}<small>${small}</small></p><div class="stars">★★★</div><div class="btns"><button class="pill b" id="dAgain">Play again</button><a class="pill a" href="../" style="text-decoration:none">All games</a></div></div>`;
  $("#bigArt").append(K.art(artName,200));$("#dAgain").onclick=()=>{$("#overlay").innerHTML="";begin()};}

let N=4,walls=[],cur=[0,0],path=[],goal=[3,3],S=0,cv=null,ctx=null,hero="bunny",prize="carrot",won=false;
const PAIRS=[["bunny","carrot"],["mouse","cupcake"],["cat","fish"],["elephant","banana"],["bear","apple"],["puppy","ball"]];
function gen(n){const W=[];for(let y=0;y<n;y++){W.push([]);for(let x=0;x<n;x++)W[y].push({n:1,e:1,s:1,w:1,v:0})}
  const st=[[0,0]];W[0][0].v=1;const D=[[0,-1,"n","s"],[1,0,"e","w"],[0,1,"s","n"],[-1,0,"w","e"]];
  while(st.length){const[x,y]=st[st.length-1];const nb=K.shuffle(D).filter(([dx,dy])=>{const a=x+dx,b=y+dy;return a>=0&&b>=0&&a<n&&b<n&&!W[b][a].v});
    if(!nb.length){st.pop();continue}const[dx,dy,s1,s2]=nb[0];W[y][x][s1]=0;W[y+dy][x+dx][s2]=0;W[y+dy][x+dx].v=1;st.push([x+dx,y+dy])}return W}
function open(a,b){const dx=b[0]-a[0],dy=b[1]-a[1];if(Math.abs(dx)+Math.abs(dy)!==1)return false;const c=walls[a[1]][a[0]];return dx===1?!c.e:dx===-1?!c.w:dy===1?!c.s:!c.n}
function bfs(a,b,lim){const key=p=>p[0]+","+p[1],prev={},q=[a];prev[key(a)]=null;while(q.length){const p=q.shift();if(p[0]===b[0]&&p[1]===b[1])break;for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[p[0]+d[0],p[1]+d[1]];if(n[0]<0||n[1]<0||n[0]>=N||n[1]>=N||key(n) in prev||!open(p,n))continue;prev[key(n)]=p;q.push(n)}}
  if(!(key(b) in prev))return null;const out=[];let p=b;while(p&&!(p[0]===a[0]&&p[1]===a[1])){out.unshift(p);p=prev[key(p)]}return out.length<=lim?out:null}
function draw(t){if(!cv||!cv.isConnected)return;const d=Math.min(window.devicePixelRatio||1,2),c=ctx,cs=100/N;c.setTransform(S*d/100,0,0,S*d/100,0,0);c.fillStyle="#f4fbff";c.fillRect(0,0,100,100);
  c.strokeStyle="#ffd166";c.lineWidth=cs*.35;c.lineCap="round";c.lineJoin="round";c.beginPath();path.forEach((p,i)=>{const x=(p[0]+.5)*cs,y=(p[1]+.5)*cs;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();
  c.strokeStyle="#5b4bb7";c.lineWidth=Math.max(1.2,cs*.12);c.beginPath();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const w=walls[y][x],X=x*cs,Y=y*cs;if(w.n){c.moveTo(X,Y);c.lineTo(X+cs,Y)}if(w.w){c.moveTo(X,Y);c.lineTo(X,Y+cs)}if(y===N-1&&w.s){c.moveTo(X,Y+cs);c.lineTo(X+cs,Y+cs)}if(x===N-1&&w.e){c.moveTo(X+cs,Y);c.lineTo(X+cs,Y+cs)}}c.stroke();
  const gs=cs*.85,bob=Math.sin(t*4)*cs*.04;c.save();c.translate((goal[0]+.5)*cs-gs/2,(goal[1]+.5)*cs-gs/2+bob);c.scale(gs/100,gs/100);K.drawArt(c,prize);c.restore();
  const hs=cs*.9;c.save();c.translate((cur[0]+.5)*cs-hs/2,(cur[1]+.5)*cs-hs/2);c.scale(hs/100,hs/100);K.drawArt(c,hero);c.restore();
  requestAnimationFrame(x=>draw(x/1000))}
function step(to){if(won)return;if(path.length>1&&to[0]===path[path.length-2][0]&&to[1]===path[path.length-2][1]){path.pop();cur=to;return}
  if(!path.some(p=>p[0]===to[0]&&p[1]===to[1]))path.push(to);else{while(path.length&&!(path[path.length-1][0]===to[0]&&path[path.length-1][1]===to[1]))path.pop()}cur=to;K.sfx.tap();
  if(cur[0]===goal[0]&&cur[1]===goal[1]){won=true;K.sfx.yay();K.toast(K.praise());K.speak(`Yummy! You found the ${K.label(prize).toLowerCase()}!`);const my=run;setTimeout(()=>{if(my!==run)return;round++;if(round>=TOTAL){dots();finishScreen("MAZE MASTER!","You solved every maze!","எல்லா வழிகளையும் கண்டுபிடித்தாய்!","crown")}else next()},1600)}}
function moveTo(cell){if(cell[0]===cur[0]&&cell[1]===cur[1])return;if(open(cur,cell)){step(cell);return}const p=bfs(cur,cell,4);if(p)for(const c of p)step(c)}
function begin(){round=0;next()}
function next(){run++;won=false;dots();N=[4,5,6,7,8][round];walls=gen(N);cur=[0,0];goal=[N-1,N-1];path=[[0,0]];[hero,prize]=K.pick(PAIRS);
  const r=area.getBoundingClientRect();S=Math.floor(Math.min(r.width,r.height-10,520));
  area.innerHTML="";cv=document.createElement("canvas");cv.id="mz";const d=Math.min(window.devicePixelRatio||1,2);cv.width=cv.height=Math.round(S*d);cv.style.width=cv.style.height=S+"px";cv.tabIndex=0;cv.dataset.tvfirst="1";cv.setAttribute("data-arrows","");cv.setAttribute("aria-label","Maze. Use the arrow keys to move.");ctx=cv.getContext("2d");area.append(cv);
  let down=false;const cell=e=>{const b=cv.getBoundingClientRect();return[Math.floor((e.clientX-b.left)/b.width*N),Math.floor((e.clientY-b.top)/b.height*N)].map(v=>Math.max(0,Math.min(N-1,v)))};
  cv.onpointerdown=e=>{K.actx();down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}moveTo(cell(e))};cv.onpointermove=e=>{if(down)moveTo(cell(e))};cv.onpointerup=cv.onpointercancel=()=>{down=false};
  cv.addEventListener("keydown",e=>{const m={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!m)return;e.preventDefault();const to=[cur[0]+m[0],cur[1]+m[1]];if(to[0]>=0&&to[1]>=0&&to[0]<N&&to[1]<N&&open(cur,to))step(to);else K.sfx.oops()});
  requestAnimationFrame(x=>draw(x/1000));if(K.tv)setTimeout(()=>K.focus(cv),60);
  say(`Help ${K.label(hero).toLowerCase()} get the ${K.label(prize).toLowerCase()}!`);}
function intro(){area.innerHTML=`<div class="start"><div class="art" id="sArt"></div><h2>Kutty Maze</h2><p>Drag the animal through the maze to reach its food. Mazes get bigger each time!</p><button class="go pulse" id="bGo">Let's go!</button></div>`;
  ["bunny","carrot"].forEach(n=>$("#sArt").append(K.art(n,80)));dots();say("Can you find the way?");$("#bGo").onclick=()=>{K.actx();K.sfx.pop();begin()}}
intro();

K.sw();
})();
</script>
</body>
</html>
