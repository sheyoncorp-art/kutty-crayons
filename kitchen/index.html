<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kutty Kitchen</title>
<meta name="theme-color" content="#fff6ea">
<meta name="description" content="Cook dosa, lemon juice, fruit salad, pizza and cupcakes for hungry animal friends.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-screen game — instruction card on top, square kitchen counter in the middle, ingredient tray below. Single bright look on purpose. */
:root{
  --paper:#fff6ea; --sheet:#ffffff; --ink:#2b2540; --muted:#8a83a3;
  --sun:#ffd166; --pink:#ff8fb8; --mint:#7fe0c3; --sky:#8fd3ff; --lilac:#cbb8ff; --tomato:#ff6b5a;
  --font:"Baloo Thambi 2","Nirmala UI","Latha",system-ui,sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.screen{height:100%;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;max-width:640px;margin:0 auto}
#picker{overflow:auto}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.stk{width:52px;height:52px;border-radius:17px;border:3px solid #fff;background:var(--c,var(--sky));box-shadow:0 3px 0 rgba(43,37,64,.16),0 8px 16px rgba(43,37,64,.10);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink);text-decoration:none;flex:none}
.stk:active{transform:translateY(2px) scale(.96)}
.stk svg{width:28px;height:28px}
.ph{display:flex;gap:12px;align-items:center;padding-top:4px}
.ph h1{margin:0;font-size:32px;font-weight:800;line-height:1}
.ph p{margin:3px 0 0;color:var(--muted);font-weight:600;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding-bottom:20px}
.dish{border:3px solid #fff;background:var(--sheet);border-radius:24px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 rgba(43,37,64,.10),0 10px 20px rgba(43,37,64,.06)}
.dish:active{transform:scale(.97)}
.dish canvas{width:112px;height:112px}
.dish b{font-size:19px;font-weight:800;line-height:1.1}
.dish span{font-size:14px;color:var(--muted);font-weight:600;line-height:1.2}
.dish i{font-style:normal;color:#e7a500;font-size:15px;letter-spacing:2px;min-height:18px}
.gh{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center}
.card{display:flex;align-items:center;gap:10px;background:var(--sheet);border:3px solid #fde3cf;border-radius:20px;padding:6px 12px;box-shadow:0 6px 14px rgba(43,37,64,.08);min-width:0;min-height:66px}
.card>svg{flex:none;width:40px;height:40px}
.card .txt{min-width:0;flex:1}
#dishName{display:block;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.2}
#say{margin:0;font-weight:800;font-size:17px;line-height:1.15;text-wrap:balance}
.pbar{height:6px;border-radius:6px;background:#f3ebff;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tomato),var(--sun));border-radius:6px;transition:width .15s}
.dots{display:flex;justify-content:center;align-items:center;gap:10px;min-height:22px}
#dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#dots i{width:10px;height:10px;border-radius:50%;background:#e6def3;transition:transform .2s}
#dots i.on{background:var(--mint)}
#dots i.cur{background:var(--tomato);transform:scale(1.35)}
.mini{border:0;background:#f3ecff;color:var(--muted);border-radius:999px;height:24px;padding:0 10px;font:700 12px/1 var(--font);cursor:pointer;display:flex;align-items:center;gap:4px}
.mini svg{width:14px;height:14px}
#stage{flex:1;min-height:0;position:relative;touch-action:none}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:28px;background:#fff;box-shadow:0 10px 30px rgba(43,37,64,.12),0 0 0 3px #fff}
#tray{min-height:100px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding-bottom:4px}
.tile{width:88px;height:94px;border-radius:22px;border:3px solid #fff;background:#fff;box-shadow:0 4px 0 rgba(43,37,64,.12),0 10px 16px rgba(43,37,64,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font:700 13px/1.05 var(--font);color:var(--ink);touch-action:none;position:relative;cursor:grab;padding:0 4px;text-align:center}
.tile canvas{width:62px;height:62px;pointer-events:none}
.tile.drag{animation:nudge 1.8s ease-in-out infinite}
.tile.away{opacity:.3;animation:none}
@keyframes nudge{0%,65%,100%{transform:none}75%{transform:translateY(-7px) rotate(-5deg)}87%{transform:translateY(0) rotate(4deg)}}
.badge{position:absolute;top:-9px;right:-9px;background:var(--tomato);color:#fff;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:15px;font-weight:800;border:3px solid #fff}
.hintTile{background:#f3ecff;cursor:default}
.hintTile svg{width:44px;height:44px;margin-bottom:4px}
.go{border:4px solid #fff;background:var(--tomato);color:#fff;font:800 24px/1 var(--font);border-radius:999px;padding:16px 36px;box-shadow:0 5px 0 #d84a3b,0 12px 20px rgba(43,37,64,.15);cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.knob{display:flex;align-items:center;gap:10px;border:4px solid #fff;background:#ff9f1c;color:#fff;font:800 20px/1 var(--font);border-radius:999px;padding:10px 24px 10px 12px;box-shadow:0 5px 0 #d97c00,0 12px 20px rgba(43,37,64,.15);cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
.knob svg{width:44px;height:44px}
.knob[disabled]{animation:none;background:#ffb85c;box-shadow:0 3px 0 #d97c00;cursor:default}
.chips{display:flex;gap:10px;align-items:center}
.chip{width:48px;height:48px;border-radius:50%;border:4px solid #fff;background:var(--c);box-shadow:0 3px 0 rgba(43,37,64,.16);cursor:pointer;padding:0;transition:transform .15s}
.chip[aria-pressed="true"]{transform:translateY(-5px) scale(1.08);box-shadow:0 0 0 3px var(--ink)}
.ghost{position:fixed;left:0;top:0;width:88px;height:88px;pointer-events:none;z-index:50;filter:drop-shadow(0 10px 10px rgba(43,37,64,.25));transition:none}
.ghost.back{transition:transform .3s ease,opacity .3s}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:var(--sheet);border:4px solid var(--sun);border-radius:24px;padding:10px 20px;font-weight:800;font-size:22px;z-index:60;pointer-events:none;transition:all .3s cubic-bezier(.3,1.6,.5,1);text-align:center;box-shadow:0 12px 30px rgba(43,37,64,.18);max-width:80vw}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.conf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:70;pointer-events:none;animation:fall var(--d) cubic-bezier(.25,.6,.45,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.done{position:fixed;inset:0;z-index:55;background:#ffb48a;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px))}
.done h1{margin:18px 0 10px;font-weight:800;font-size:46px;color:#fff6c9;letter-spacing:.03em;-webkit-text-stroke:2px #b2491f;paint-order:stroke fill;text-shadow:0 4px 0 #c45a2a;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}}
.plate{width:min(260px,72vw);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 14px 30px rgba(120,40,10,.25),inset 0 0 0 10px #fff3ea;display:grid;place-items:center;animation:pop .5s .1s both cubic-bezier(.3,1.6,.5,1)}
.plate canvas{width:82%;height:82%}
.done p{margin:14px 0 0;color:#fff;font-weight:800;font-size:20px;text-align:center;text-shadow:0 2px 0 rgba(150,50,10,.35)}
.done small{display:block;font-size:15px;font-weight:700;opacity:.9}
.stars{font-size:38px;color:#ffe066;letter-spacing:6px;text-shadow:0 3px 0 #c45a2a;margin-top:4px}
.btns{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.pill{border:4px solid #fff;border-radius:999px;padding:10px 22px;font:800 19px/1 var(--font);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(43,37,64,.25)}
.pill.a{background:#3a9df0}.pill.b{background:#3ccf6a}.pill.c{background:#8e6cff}
@media (prefers-reduced-motion:reduce){.tile.drag,.go,.knob{animation:none}.conf{display:none}}
</style>
</head>
<body>

<div id="picker" class="screen">
  <header class="ph">
    <a class="stk" href="../" style="--c:var(--lilac)" aria-label="All games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></a>
    <div><h1>Kutty Kitchen</h1><p>குட்டி சமையலறை · Pick a dish to cook</p></div>
  </header>
  <div class="grid" id="dishGrid"></div>
</div>

<div id="game" class="screen" hidden>
  <header class="gh">
    <button class="stk" id="bBack" style="--c:var(--mint)" aria-label="Back to dishes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></button>
    <div class="card">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#ffe1cc"/><path d="M13 27c-5-1-6-9 0-10 1-6 9-8 11-3 3-5 11-3 11 3 6 1 5 9 0 10v6H13z" fill="#fff" stroke="#2b2540" stroke-width="2" stroke-linejoin="round"/><rect x="13" y="31" width="22" height="6" rx="2" fill="#fff" stroke="#2b2540" stroke-width="2"/></svg>
      <div class="txt"><span id="dishName"></span><p id="say"></p><div class="pbar"><i id="pfill"></i></div></div>
    </div>
    <button class="stk" id="bSound" style="--c:var(--sun)" aria-label="Sound on"></button>
  </header>
  <div class="dots"><div id="dots"></div><button class="mini" id="bSkip" aria-label="Skip this step"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5l9 7-9 7zM12 5l9 7-9 7z"/></svg>Skip</button></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="tray"></div>
</div>

<div id="overlay"></div>
<div class="toast" id="toast"></div>

<script src="../shared/kit.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const PI=Math.PI,TAU=PI*2,INK="#2b2540";
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hex(c){const n=parseInt(c.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){t=clamp(t,0,1);const x=hex(a),y=hex(b);return"rgb("+x.map((v,i)=>Math.round(lerp(v,y[i],t))).join(",")+")"}
function rng(seed){return function(){seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fs(c,fill,stroke,lw){if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1;c.stroke()}}
function circ(c,x,y,r,fill,stroke,lw){c.beginPath();c.arc(x,y,Math.max(.01,r),0,TAU);fs(c,fill,stroke,lw)}
function ell(c,x,y,rx,ry,fill,stroke,lw,rot){c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,TAU);fs(c,fill,stroke,lw)}
function seg(c,x1,y1,x2,y2,col,lw){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=lw;c.lineCap="round";c.stroke()}
function heart(c,x,y,s,col){c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x,y-s*.25,x-s,y-s*.25,x-s,y+s*.25);c.bezierCurveTo(x-s,y+s*.7,x,y+s,x,y+s*1.2);c.bezierCurveTo(x,y+s,x+s,y+s*.7,x+s,y+s*.25);c.bezierCurveTo(x+s,y-s*.25,x,y-s*.25,x,y+s*.35);c.closePath();c.fillStyle=col;c.fill()}
function star4(c,x,y,s,col){c.beginPath();for(let i=0;i<8;i++){const a=i*PI/4,r=i%2?s*.35:s;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath();c.fillStyle=col;c.fill()}
const scratch=document.createElement("canvas").getContext("2d");

/* ================= backgrounds ================= */
function tiles(c,a,b){c.fillStyle=a;c.fillRect(0,0,100,100);c.strokeStyle=b;c.lineWidth=.5;c.beginPath();for(let i=12.5;i<100;i+=12.5){c.moveTo(i,0);c.lineTo(i,100);c.moveTo(0,i);c.lineTo(100,i)}c.stroke()}
function checker(c){c.fillStyle="#ffffff";c.fillRect(0,0,100,100);c.fillStyle="#e9f3ff";for(let y=0;y<10;y++)for(let x=0;x<10;x++)if((x+y)%2)c.fillRect(x*10,y*10,10,10)}
function wall(c,w){c.fillStyle=w;c.fillRect(0,0,100,100);c.fillStyle="#f5c98f";c.fillRect(0,86,100,14);c.fillStyle="#e5ad68";c.fillRect(0,86,100,2)}
function stoveBg(c,st,t){
  tiles(c,"#f6ecdc","#ead9bf");rrect(c,6,10,88,86,9);fs(c,"#463f5e","#2f2a42",1.2);
  for(const x of [16,84])circ(c,x,17,2.6,"#d9d0ec",INK,.6);
  circ(c,50,57,40,null,"#5d5679",2);
  if(st.fire){for(let i=0;i<22;i++){const a=i/22*TAU,fl=1+Math.sin(t*18+i*1.7)*.35;c.save();c.translate(50+Math.cos(a)*37.5,57+Math.sin(a)*37.5);c.rotate(a+PI/2);c.beginPath();c.moveTo(-2.3,0);c.quadraticCurveTo(0,-7.5*fl,2.3,0);c.closePath();fs(c,i%2?"#ff9f1c":"#5aa9ff");c.restore()}}
}
function boardBg(c){
  tiles(c,"#f6ecdc","#ead9bf");rrect(c,7,14,86,76,12);fs(c,"#e9b97c","#c98d4f",1.6);
  c.strokeStyle="rgba(170,110,50,.3)";c.lineWidth=.7;for(let i=0;i<6;i++){c.beginPath();c.moveTo(12,24+i*12);c.bezierCurveTo(35,20+i*12,60,30+i*12,88,24+i*12);c.stroke()}
  circ(c,83,22,3,"#f6ecdc","#c98d4f",1);
}
function counterBg(c){
  c.fillStyle="#ffe9f1";c.fillRect(0,0,100,100);
  rrect(c,6,8,26,20,4);fs(c,"#cdeeff","#ffffff",2);seg(c,19,8,19,28,"#fff",1.4);seg(c,6,18,32,18,"#fff",1.4);
  c.fillStyle="#f7d2df";c.fillRect(0,56,100,2);
}
function counterFront(c){c.fillStyle="#f2b56b";c.fillRect(0,72,100,28);c.fillStyle="#e09a4f";c.fillRect(0,72,100,3);c.fillStyle="rgba(255,255,255,.2)";c.fillRect(0,82,100,1.2)}
function drawOven(c,st,t,inner){
  tiles(c,"#f6ecdc","#ead9bf");rrect(c,6,8,88,88,9);fs(c,"#ece6f6","#cfc4e6",1.5);
  rrect(c,12,13,76,10,4);fs(c,"#dcd3ee");for(const x of [22,33])circ(c,x,18,3,"#fff",INK,.7);
  circ(c,78,18,2.4,st.fire?"#ff7a2e":"#b4adc6");
  rrect(c,14,28,72,60,7);fs(c,"#2b2540");
  c.save();rrect(c,14,28,72,60,7);c.clip();
  if(st.fire){const g=c.createRadialGradient(50,58,4,50,58,48);g.addColorStop(0,"rgba(255,170,60,"+(.6+.1*Math.sin(t*6))+")");g.addColorStop(1,"rgba(255,90,40,.15)");c.fillStyle=g;c.fillRect(14,28,72,60)}
  for(const y of [32,84]){c.beginPath();for(let x=16;x<=84;x+=2)c.lineTo(x,y+Math.sin(x*.6)*.8);c.strokeStyle=st.fire?"#ff5a2a":"#5a5470";c.lineWidth=1.2;c.stroke()}
  c.save();c.translate(50,60);c.scale(.62,.62);c.translate(-50,-58);inner();c.restore();
  c.fillStyle="rgba(255,255,255,.07)";c.beginPath();c.moveTo(14,70);c.lineTo(46,28);c.lineTo(58,28);c.lineTo(20,88);c.closePath();c.fill();
  c.restore();
  rrect(c,30,90,40,3,1.5);fs(c,"#b4adc6");
}
function bowlTop(c,x,y,r,fill,seed,dots){
  circ(c,x,y,r,"#ffffff","#d8d1e6",1);circ(c,x,y,r*.78,fill);
  const R=rng(seed);for(let i=0;i<dots.n;i++){const a=R()*TAU,d=Math.sqrt(R())*r*.65;circ(c,x+Math.cos(a)*d,y+Math.sin(a)*d,dots.r*(0.6+R()*.6),dots.cols[i%dots.cols.length])}
}

/* ================= animal friends ================= */
const ANIMALS={
  bear:{name:"Bobo the bear",short:"Bobo",col:"#b9845a",ear:"round",muzzle:"#ecd0ad"},
  cat:{name:"Mimi the cat",short:"Mimi",col:"#ffb04d",ear:"pointy",muzzle:"#fff1dc"},
  elephant:{name:"Gogo the elephant",short:"Gogo",col:"#a9b4cc",ear:"big",muzzle:null},
  puppy:{name:"Tommy the puppy",short:"Tommy",col:"#e3b98a",ear:"flop",muzzle:"#fff1dc"},
  bunny:{name:"Pinky the bunny",short:"Pinky",col:"#f4efff",ear:"long",muzzle:"#ffffff"},
  goat:{name:"Gundu the goat",short:"Gundu",col:"#efe7d8",kit:1},mouse:{name:"Chikki the mouse",short:"Chikki",col:"#b8b8c8",kit:1},zebra:{name:"Zuzu the zebra",short:"Zuzu",col:"#ffffff",kit:1}};
function animal(c,kind,x,y,s,happy,t){
  const A=ANIMALS[kind];c.save();c.translate(x,y+Math.sin(t*3)*.7);c.scale(s,s);
  const L=1.1;
  ell(c,0,24,21,12,A.col,INK,L);
  for(const k of [-1,1]){
    if(A.ear==="round"){circ(c,k*13,-13,6.5,A.col,INK,L);circ(c,k*13,-13,3.4,"#e7a98a")}
    if(A.ear==="pointy"){c.beginPath();c.moveTo(k*16,-6);c.lineTo(k*14,-23);c.lineTo(k*4,-15);c.closePath();fs(c,A.col,INK,L);c.beginPath();c.moveTo(k*13.5,-9);c.lineTo(k*12.8,-19);c.lineTo(k*7,-14);c.closePath();fs(c,"#ffb8c8")}
    if(A.ear==="big"){ell(c,k*20,2,11,14,A.col,INK,L);ell(c,k*20,2,7,10,"#f3bccb")}
    if(A.ear==="flop"){ell(c,k*16,0,6,12.5,"#b8875a",INK,L,k*.45)}
    if(A.ear==="long"){ell(c,k*6.5,-27,4.8,13.5,A.col,INK,L,k*.12);ell(c,k*6.5,-26,2.3,9.5,"#ffc2d6",null,0,k*.12)}
  }
  circ(c,0,0,18,A.col,INK,L);
  if(A.muzzle)ell(c,0,6,8.5,6.2,A.muzzle);

/* scrub coverage */
function prepScrub(){const P=step.path(),b=step.bbox,pts=[];for(let y=b[1];y<=b[3];y+=2)for(let x=b[0];x<=b[2];x+=2)if(scratch.isPointInPath(P,x,y))pts.push(x,y);samples=pts;covered=new Uint8Array(pts.length/2);coverN=0;st._row=0;if(step.colors&&!st[step.layer+"Col"])st.creamCol=step.colors[0]}

  const p=coverN/covered.length;setBar(p/step.cover);if(got&&Math.random()<.35)sfx.stir();

function endPointer(){

function startDrag(e,tile){

}

function skipStep(){

  if(s.type==="tap"){let x=z[0],y=z[1];for(let k=0;k<40;k++){const a=Math.random()*TAU,d=Math.random()*z[2]*.8;x=z[0]+Math.cos(a)*d;y=z[1]+Math.sin(a)*d;if(!s.inside||scratch.isPointInPath(s.inside(),x,y))break}
    s.on(st,x,y,count);count++;sfx.tap();burst(x,y,5,"dot",["#ffffff","#ffd23f"],14);setBar(count/s.times);if(count>=s.times)completeStep()}
  else if(s.type==="stir"){stirAcc+=TAU/3;const pr=clamp(stirAcc/(s.turns*TAU),0,1);s.on(st,pr);setBar(pr);sfx.stir();if(pr>=1)completeStep()}
  else if(s.type==="swipe"){const T=s.target,a=[T[0]+2,lerp(T[1],T[3],.3+Math.random()*.4)],b=[T[2]-2,lerp(T[1],T[3],.3+Math.random()*.4)],now=performance.now();
    for(let i=0;i<=12;i++)trail.push({x:lerp(a[0],b[0],i/12),y:lerp(a[1],b[1],i/12),t:now+i*10});s.on(st,count,a,b);count++;sfx.chop();setBar(count/s.times);if(count>=s.times)completeStep()}

    b.append(iconCanvas(c=>{circ(c,50,52,48,"#fff3ea");r.obj(c,demo,r.dishView,0)},112));
    b.insertAdjacentHTML("beforeend",`<b>${r.name}</b><span>${r.ta}</span><span>for ${ANIMALS[r.animal].short}</span><i>${done[r.id]?"★★★":""}</i>`);
    b.onclick=()=>{actx();startRecipe(i)};g.append(b)});
}
$("#bBack").onclick=showPicker;
$("#bSound").onclick=()=>{sound=!sound;store.set("kk_sound",sound);soundIcon();if(!sound){sizzleStop();try{speechSynthesis.cancel()}catch(e){}}else{if(st&&st.fire)sizzleStart(step&&step.oven);sfx.pop()}};
soundIcon();

/* ================= draw loop ================= */
function drawHints(c,t){
  if(!step||lock||down||performance.now()-lastAct<1400)return;
  const k=step.type,pulse=1+Math.sin(t*5)*.06;c.save();c.lineCap="round";
  if(k==="drag"||k==="serve"){const z=k==="serve"?[44,46,22]:step.zone;c.setLineDash([3,3]);c.lineDashOffset=-t*8;c.strokeStyle="rgba(255,255,255,.95)";c.lineWidth=1.8;c.beginPath();c.arc(z[0],z[1],z[2]*pulse,0,TAU);c.stroke();c.strokeStyle="rgba(255,107,90,.9)";c.lineWidth=1;c.stroke()}
  if(k==="tap"){const z=step.zone,ph=(t*1.2)%1;c.globalAlpha=1-ph;circ(c,z[0],z[1],3+ph*10,null,"#ffffff",2);c.globalAlpha=1;circ(c,z[0],z[1],2.4,"#ff6b5a","#fff",1)}
  if(k==="stir"){const z=step.zone,a=t*3;c.strokeStyle="rgba(255,255,255,.95)";c.lineWidth=2.2;c.beginPath();c.arc(z[0],z[1],z[2]*.6,a,a+PI*1.4);c.stroke();const ex=z[0]+Math.cos(a+PI*1.4)*z[2]*.6,ey=z[1]+Math.sin(a+PI*1.4)*z[2]*.6;circ(c,ex,ey,2.6,"#ff6b5a","#fff",1)}
  if(k==="swipe"){const T=step.target,y=(T[1]+T[3])/2,ph=(t*.8)%1,x0=T[0]+4,x1=T[2]-4,x=lerp(x0,x1,ph);c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=2.4;c.setLineDash([2.5,3]);c.beginPath();c.moveTo(x0,y+6);c.lineTo(x1,y-6);c.stroke();c.setLineDash([]);circ(c,x,lerp(y+6,y-6,ph),3,"#ff6b5a","#fff",1.2)}
  if(k==="scrub"){const b=step.bbox,ph=(t*.6)%1;c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=2.2;c.setLineDash([2.5,3]);c.beginPath();for(let i=0;i<=6;i++){const x=lerp(b[0]+6,b[2]-6,i/6),y=i%2?b[1]+8:b[3]-8;c.lineTo(x,y)}c.stroke();c.setLineDash([]);const i=Math.floor(ph*6),f=ph*6-i,xa=lerp(b[0]+6,b[2]-6,i/6),xb=lerp(b[0]+6,b[2]-6,(i+1)/6),ya=i%2?b[1]+8:b[3]-8,yb=(i+1)%2?b[1]+8:b[3]-8;circ(c,lerp(xa,xb,f),lerp(ya,yb,f),3,"#ff6b5a","#fff",1.2)}
  c.restore();
}
function draw(t){
  const c=ctx,K=S/100;c.setTransform(K*dpr,0,0,K*dpr,0,0);c.clearRect(0,0,100,100);
  const v=st.view;
  if(v==="counter"){counterBg(c);const A=ANIMALS[R.animal];if(A.kit)Kit.animal(c,R.animal,44,50,1.12,!!st.served,t);else animal(c,R.animal,44,50,1.12,!!st.served,t);counterFront(c);ell(c,33,75,6,4,A.col,INK,1);ell(c,55,75,6,4,A.col,INK,1);
    if(st.served){c.save();c.translate(30,62);c.scale(.28,.28);R.obj(c,st,R.dishView,t);c.restore()}
    else if(si>0||step.type==="intro"){rrect(c,66,6,31,30,8);fs(c,"#fff",INK,1);c.beginPath();c.moveTo(70,34);c.lineTo(64,42);c.lineTo(77,35);c.closePath();fs(c,"#fff");seg(c,70,35.4,64,42,INK,1);seg(c,64,42,77,35.4,INK,1);
      const demo=step.type==="serve"?st:Object.assign(R.init(),R.demo());c.save();c.translate(68,7);c.scale(.27,.27);R.obj(c,demo,R.dishView,t);c.restore()}}
  else if(v==="oven")drawOven(c,st,t,()=>R.obj(c,st,"oven",t));
  else{BGS[v](c,st,t);R.obj(c,st,v,t)}
  drawHints(c,t);
  if(step&&step.type==="stir"&&down&&lastP){c.save();c.translate(lastP[0],lastP[1]);c.rotate(-.55);ell(c,0,0,4,5.5,"#e2a865",INK,.8);rrect(c,-1.3,4.5,2.6,24,1.3);fs(c,"#e2a865",INK,.8);c.restore()}
  const now=performance.now();trail=trail.filter(p=>now-p.t<220);if(trail.length>1){c.lineCap="round";c.lineJoin="round";for(let i=1;i<trail.length;i++){const a=1-(now-trail[i].t)/220;c.strokeStyle="rgba(255,255,255,"+a+")";c.lineWidth=3.2*a;c.beginPath();c.moveTo(trail[i-1].x,trail[i-1].y);c.lineTo(trail[i].x,trail[i].y);c.stroke()}}
  for(const p of parts){c.globalAlpha=clamp(p.life,0,1);if(p.kind==="heart")heart(c,p.x,p.y,p.r*1.8,p.col);else if(p.kind==="star")star4(c,p.x,p.y,p.r*2,p.col);else if(p.kind==="drop")ell(c,p.x,p.y,p.r*.8,p.r*1.3,p.col);else if(p.kind==="steam")circ(c,p.x,p.y,p.r,"rgba(255,255,255,.45)");else circ(c,p.x,p.y,p.r,p.col)}
  c.globalAlpha=1;
}
let lastT=performance.now(),steamT=0;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(R&&st&&S){
    tweens=tweens.filter(w=>{const k=clamp((now-w.t0)/w.ms,0,1),e=1-Math.pow(1-k,3);w.o[w.k]=lerp(w.a,w.b,e);return k<1});
    if(step&&step.type==="wait"&&st.fire&&!lock){const p=clamp((now-waitT0)/(step.secs*1000),0,1);step.on(st,p);setBar(p);if(p>=1){st.fire=0;sizzleStop();completeStep()}}
    if(st.fire&&(steamT+=dt)>.12){steamT=0;const ov=st.view==="oven",sv=st.view==="steam";parts.push({x:(ov?40:38)+Math.random()*(ov?20:24),y:sv?32:ov?50:52,vx:(Math.random()-.5)*3,vy:-9,life:1,max:1.3,kind:"steam",col:"#fff",r:1.5,g:0,grow:2.2})}
    parts=parts.filter(p=>{p.life-=dt/p.max;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.grow)p.r+=p.grow*dt;return p.life>0&&p.y<110});
    draw(now/1000);
  }
  requestAnimationFrame(frame);
}
function layout(){const r=stage.getBoundingClientRect(),n=Math.floor(Math.min(r.width,r.height,560));if(n<60)return;S=n;cv.style.width=cv.style.height=S+"px";cv.width=cv.height=Math.round(S*dpr)}
new ResizeObserver(layout).observe(stage);
showPicker();requestAnimationFrame(frame);
window.__kk={start:startRecipe,skip:skipStep,state:()=>({si,type:step&&step.type,view:st&&st.view,lock})};
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(()=>{}));
})();
</script>
